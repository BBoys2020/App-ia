<!-- Adicione esta seção no painel admin, após "Sistema de Saque" -->

<div class="card">
    <h3 style="color:var(--text-white); margin-bottom:15px;">💳 Solicitações de Saque PIX</h3>
    <div id="pixRequests">
        <div style="text-align:center; color:var(--text-main); padding:20px;">
            Nenhuma solicitação pendente.
        </div>
    </div>
</div>

<!-- Adicione esta função no JavaScript -->
<script>
    // ==================== SISTEMA DE SAQUE PIX ====================
    
    function renderPixRequests() {
        const container = document.getElementById('pixRequests');
        const pending = withdrawals.filter(w => w.status === 'pending' && w.method === 'pix');
        
        if (pending.length === 0) {
            container.innerHTML = `
            <div style="text-align:center; color:var(--text-main); padding:20px;">
                ✅ Nenhuma solicitação PIX pendente.
            </div>
        `;
            return;
        }
        
        container.innerHTML = pending.map((item, index) => `
        <div class="history-item" style="border-left-color: var(--gold);">
            <div>
                <strong>💰 ${item.amount} HW</strong>
                <div class="time">📱 PIX: ${item.paymentKey}</div>
                <div class="time">📅 ${item.time}</div>
            </div>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <button class="btn-small" onclick="markAsPaid(${index})" 
                        style="width:auto; background:var(--success); color:#000;">
                    ✅ Pago
                </button>
                <button class="btn-small" onclick="markAsCanceled(${index})" 
                        style="width:auto; background:var(--danger); color:#fff;">
                    ❌ Cancelar
                </button>
            </div>
        </div>
    `).join('');
    }
    
    function markAsPaid(index) {
        if (!confirm('Confirmar que o PIX foi pago para este usuário?')) return;
        
        withdrawals[index].status = 'paid';
        saveData();
        renderPixRequests();
        renderWithdrawHistory();
        showToast('✅ Pagamento marcado como concluído!', 'success');
    }
    
    function markAsCanceled(index) {
        if (!confirm('Cancelar esta solicitação de saque?')) return;
        
        // Devolver os créditos
        const amount = withdrawals[index].amount;
        availableBalance += amount;
        credits += amount;
        
        withdrawals[index].status = 'canceled';
        saveData();
        updateAdminStats();
        renderPixRequests();
        renderWithdrawHistory();
        showToast(`❌ Saque cancelado. ${amount} HW devolvidos.`, 'info');
    }
    
    // Atualizar o confirmWithdraw para incluir PIX
    function confirmWithdraw() {
        const data = window._pendingWithdraw;
        if (!data) return;
        
        // Deduzir do saldo
        availableBalance -= data.amount;
        
        // Registrar saque
        withdrawals.push({
            amount: data.amount,
            method: data.method,
            paymentKey: data.paymentKey,
            time: new Date().toLocaleString(),
            status: 'pending'
        });
        
        updateAdminStats();
        saveData();
        renderWithdrawHistory();
        renderPixRequests(); // Adicionar esta linha
        closeModal();
        
        // Mostrar instruções específicas para PIX
        if (data.method === 'pix') {
            showToast(`💳 Solicitação PIX de ${data.amount} HW recebida! Aguarde o pagamento.`, 'success');
        } else {
            showToast(`✅ Saque de ${data.amount} HW solicitado! Processamento em até 24h.`, 'success');
        }
        
        document.getElementById('paymentKey').value = '';
        document.getElementById('withdrawAmount').value = 50;
    }
    
    // Chamar renderPixRequests quando abrir o admin
    function toggleAdmin() {
        if (!isAdminLogged) {
            document.getElementById('loginOverlay').style.display = 'flex';
            return;
        }
        const panel = document.getElementById('adminPanel');
        panel.classList.toggle('active');
        if (panel.classList.contains('active')) {
            updateAdminStats();
            renderHistory();
            renderWithdrawHistory();
            renderPixRequests(); // Adicionar esta linha
        }
    }
</script>
